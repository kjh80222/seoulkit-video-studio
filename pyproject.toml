[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoulkit-studio"
version = "0.1.0"
description = "SEOULKIT MINI Video Studio - deterministic edit_plan.json render pipeline"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seoulkit_studio.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
